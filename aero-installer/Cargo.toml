[package]
name = "aero-installer"
version = "0.1.0"
edition = "2021"
description = "AeroInstaller — graphical installer for FrutigerOS"
license = "MIT"
repository = "https://github.com/frutigeros/aero-installer"
rust-version = "1.75"

[[bin]]
name = "aero-installer"
path = "src/main.rs"

[dependencies]
# Configuration / serialisation
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
slog = "2"
slog-term = "2"
slog-async = "2"

# Async (disk probing runs off the main thread)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "fs", "time"] }

# Locale / timezone lists
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.8"

[dev-dependencies]
# (none yet)

[profile.release]
opt-level = 3
lto = true
strip = true
