#
# pacman.conf used by mkarchiso when building the FrutigerOS live medium.
#
# The build host's /etc/pacman.d/mirrorlist is bind-mounted by archiso, so the
# Include paths below resolve normally during the build.
#
# When the AeroWM/AeroShell packages have been built they can be served from a
# local [frutigeros] repository. Uncomment and adjust the Server line.
#

[options]
HoldPkg = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

#[frutigeros]
#SigLevel = Optional TrustAll
#Server = file:///workspace/frutigeros-repo/$arch
