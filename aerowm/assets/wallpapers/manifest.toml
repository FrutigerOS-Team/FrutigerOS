# FrutigerOS Wallpaper Manifest
# Each entry describes an original wallpaper for the distribution.
# Actual image files will be added in Phase 4b.
# All wallpapers must be original artwork — no copyrighted assets.

[[wallpapers]]
id       = "aurora-meadow"
name     = "Aurora Meadow"
file     = "aurora-meadow.png"
thumb    = "aurora-meadow-thumb.png"
author   = "FrutigerOS Team"
license  = "CC0-1.0"
tags     = ["nature", "green", "sky", "aero"]
palette  = ["#7ED957", "#00AEEF", "#063B5C", "#EAFBFF"]
description = """
A lush green meadow under a blue sky with soft cloud formations.
Foreground: rolling hills, dew-covered grass blades.
Background: gradient sky from deep ocean blue to sky blue.
Style: Frutiger Aero — glossy, optimistic, nature-forward.
"""

