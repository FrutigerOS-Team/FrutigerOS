[package]
name = "aeroshell"
version = "0.1.0"
edition = "2021"
description = "AeroShell — desktop shell for FrutigerOS"
license = "MIT"
repository = "https://github.com/frutigeros/aeroshell"
rust-version = "1.75"

[[bin]]
name = "aeroshell"
path = "src/main.rs"

[dependencies]
# Wayland client (connects to AeroWM)
wayland-client = "0.29"
wayland-protocols = { version = "0.29", features = ["client", "unstable_protocols"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Logging
slog = "2"
slog-term = "2"
slog-async = "2"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["clock"] }

# Software rendering for the panel (glass surfaces, rounded shapes, gradients)
tiny-skia = "0.12"

# Shared-memory buffers for wl_shm
tempfile = "3"

# Polling the Wayland socket with a timeout so the clock can tick
libc = "0.2"

# Async (for notification daemon)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
# (none yet)

[profile.release]
opt-level = 3
lto = true
strip = true
